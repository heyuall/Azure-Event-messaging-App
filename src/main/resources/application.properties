server.port=8080
logging.level.com.hub=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Log cache operations
logging.level.org.hibernate.cache=DEBUG
spring.application.name=NotificationAzurePubSubApp


spring.datasource.username=postgres
spring.datasource.password=****
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/notificationPersisting

webPubSub.connectionString=Endpoint=https://webpubsubressourcename.webpubsub.azure.com;AccessKey=****;Version=1.0;

spring.cloud.azure.eventhubs.connection-string=Endpoint=sb://eventhubsspace.servicebus.windows.net/;SharedAccessKeyName=****;SharedAccessKey=****;EntityPath=eventhubhoussem

spring.cloud.azure.eventhubs.namespace=EventHubsSpace
spring.cloud.azure.eventhubs.processor.checkpoint-store.account-name=housseminstance
spring.cloud.azure.eventhubs.processor.checkpoint-store.container-name=eventhubs-checkpoint-store-container-houssem
spring.cloud.stream.bindings.consume-in-0.destination=eventhubhoussem
spring.cloud.stream.bindings.consume-in-0.group=$Default
spring.cloud.stream.bindings.supply-out-0.destination=eventhubhoussem
spring.cloud.stream.eventhubs.bindings.consume-in-0.consumer.checkpoint.mode=MANUAL
spring.cloud.function.definition=consume;supply;
spring.cloud.stream.poller.initial-delay=0
spring.cloud.stream.poller.fixed-delay=1000